apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Build ini butuh JDK 21. JDK 27 gagal di JdkImageTransform/jlink saat
// core library desugaring. Jalankan dengan:
//   JAVA_HOME=/path/to/jdk-21 ./gradlew assembleDebug
// (path tidak di-hardcode di sini supaya repo tetap portabel)
// ---------------------------------------------------------------------------
if (JavaVersion.current() != JavaVersion.VERSION_21) {
    logger.warn(
        "PERINGATAN: build ini diuji dengan JDK 21, JAVA_HOME sekarang " +
        JavaVersion.current() + ". Jika gagal di JdkImageTransform/jlink, arahkan JAVA_HOME ke JDK 21."
    )
}

// ---------------------------------------------------------------------------
// Signing release.
// Kredensial dibaca dari android/keystore.properties (di-gitignore):
//   storeFile=release.jks
//   storePassword=...
//   keyAlias=coffeeshop
//   keyPassword=...
// Buat sekalian: ./scripts/gen-keystore.sh
// Tanpa file itu, release memakai debug signing agar APK tetap bisa di-install
// untuk uji internal — JANGAN distribusikan APK debug-signed ke toko.
// ---------------------------------------------------------------------------
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
def hasReleaseSigning = false
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
    hasReleaseSigning = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every {
        keystoreProps.getProperty(it)
    }
}
if (!hasReleaseSigning) {
    logger.warn(
        "keystore.properties tidak ada / tidak lengkap — assembleRelease memakai debug signing. " +
        "Jalankan ./scripts/gen-keystore.sh untuk membuat keystore rilis."
    )
}

android {
    namespace = "com.kianlabs.coffeeshoppos"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kianlabs.coffeeshoppos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Naikkan versionCode +1 setiap rilis (wajib monoton naik).
        // versionName bebas mengikuti semver: 1.0.1, 1.1.0, 2.0.0, ...
        versionCode 2
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        // Target bytecode 21; jalankan Gradle di JDK 21 (lihat komentar di atas).
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Fallback debug signing supaya `assembleRelease` tetap menghasilkan APK
            // yang bisa di-install saat keystore rilis belum dibuat.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}

// Modul ini Java-only. Kalau nanti ditambah source Kotlin, target JVM-nya wajib 21 juga.
plugins.withId("org.jetbrains.kotlin.android") {
    android.kotlinOptions { jvmTarget = "21" }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
