name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include customer data, PINs, or backup passwords.
        For security problems, do not open an issue. Follow [SECURITY.md](https://github.com/kianlabs/coffee-shop-pos/blob/main/SECURITY.md).
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably trigger the problem.
      placeholder: |
        1. Open the cashier screen
        2. Add "Es Kopi Aren" twice
        3. Tap Bayar
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Add a screenshot or error text if you have one.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings, or the release tag you installed.
      placeholder: "1.0.1"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device or browser
      description: For Android, the tablet model and Android version. For web, the browser and version.
      placeholder: "Samsung Galaxy Tab A9+, Android 14"
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: Printer model
      description: Only if the problem involves printing.
    validations:
      required: false
