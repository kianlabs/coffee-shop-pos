name: Release & OTA Update

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build OTA Package & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Domain & Semver Tests
        run: |
          npm test
          node scripts/test-updater.mjs

      - name: Package OTA dist.zip
        run: node scripts/package-ota.mjs

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Configure Android Signing Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.jks
            PASS="${ANDROID_KEYSTORE_PASSWORD:-$ANDROID_KEY_PASSWORD}"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$PASS}"
            ALIAS="${ANDROID_KEY_ALIAS:-coffeeshop}"
            printf "storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$PASS" "$ALIAS" "$KEY_PASS" > android/keystore.properties
            chmod 600 android/release.jks android/keystore.properties
            echo "Keystore produksi berhasil dikonfigurasi."
          else
            echo "Secret ANDROID_KEYSTORE_BASE64 tidak ditemukan, assembleRelease akan menggunakan signing default."
          fi

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease -x lintVitalAnalyzeRelease
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk "Rahardjo-Coffee-POS-${{ github.ref_name }}.apk" || cp android/app/build/outputs/apk/release/app-release-unsigned.apk "Rahardjo-Coffee-POS-${{ github.ref_name }}.apk" || true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS="dist.zip"
          if [ -f "dist.zip.sha256" ]; then
            ASSETS="$ASSETS dist.zip.sha256"
          fi
          if [ -f "Rahardjo-Coffee-POS-${{ github.ref_name }}.apk" ]; then
            ASSETS="$ASSETS Rahardjo-Coffee-POS-${{ github.ref_name }}.apk"
          fi
          gh release create "${{ github.ref_name }}" $ASSETS \
            --title "Rahardjo Coffee POS ${{ github.ref_name }}" \
            --generate-notes
