name: Release & OTA Update

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build OTA Package & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Domain & Semver Tests
        run: |
          npm test
          node scripts/test-updater.mjs

      - name: Package OTA dist.zip
        run: node scripts/package-ota.mjs

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease -x lintVitalAnalyzeRelease
          cd ..
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "Rahardjo-Coffee-POS-${{ github.ref_name }}.apk" || cp android/app/build/outputs/apk/release/app-release.apk "Rahardjo-Coffee-POS-${{ github.ref_name }}.apk" || true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS="dist.zip"
          if [ -f "Rahardjo-Coffee-POS-${{ github.ref_name }}.apk" ]; then
            ASSETS="dist.zip Rahardjo-Coffee-POS-${{ github.ref_name }}.apk"
          fi
          gh release create "${{ github.ref_name }}" $ASSETS \
            --title "Rahardjo Coffee POS ${{ github.ref_name }}" \
            --generate-notes
