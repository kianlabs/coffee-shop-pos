name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Repository guards (no client brand, no APK, no AI instruction files)
        run: npm run check

      - name: Typecheck (TypeScript Strict)
        run: npm run typecheck

      - name: Run Domain & Semver Tests
        run: |
          npm test
          node scripts/test-updater.mjs

      - name: Build Web Production Assets
        run: npm run build
