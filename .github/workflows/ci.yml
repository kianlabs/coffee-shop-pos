name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (TypeScript strict)
        run: npm run typecheck
      - name: Lint (ESLint, typescript-eslint, jsx-a11y)
        run: npm run lint
      - name: Unit tests with coverage gate (domain 90%)
        run: |
          npm test
          node scripts/test-updater.mjs
      - name: Repository guards and architecture boundaries
        run: npm run check
      - name: Build web production assets
        run: npm run build
      - name: Headless UI smoke test
        run: npm run smoke:ui
