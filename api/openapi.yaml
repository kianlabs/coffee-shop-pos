openapi: 3.1.0
info:
  title: Coffee Shop POS Sync API
  version: 0.2.0
  description: |
    Kontrak opsional untuk sinkronisasi cloud. Checkout lokal TIDAK pernah
    bergantung pada API ini (offline-first, fire-and-forget).

    Aturan yang mengikat implementasi client (`src/data/sync.ts`):
    - `event_id` adalah UUID murni dan menjadi kunci idempotensi. Client
      menurunkannya secara deterministik dari id lokal, jadi retry mengirim
      UUID yang sama.
    - Server meng-ack hanya setelah event tersimpan durable. Event duplikat
      dibalas 200 dengan `duplicate: true` (boleh juga 409 dengan body sama).
    - Client retry (backoff 30s * 2^attempt, maks 1 jam) hanya untuk
      429 / 5xx / 408 / gangguan jaringan. 400 / 401 / 403 / 404 / 422
      menandai event `failed` (terminal, tidak di-retry otomatis).
    - Satu request maksimal 100 event (batch client).
servers:
  - url: https://api.example.invalid
    description: Placeholder — ganti dengan server nyata.
  - url: http://localhost:8787
    description: Mock dev (`scripts/mock-sync-server.mjs`). http hanya untuk localhost.
paths:
  /v1/sync/events:
    post:
      summary: Submit one or more durable outbox events
      description: |
        Idempoten per `event_id`. Batch boleh berisi campuran event baru,
        duplikat, dan event yang ditolak.
      operationId: pushSyncEvents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
      responses:
        "200":
          description: Event diterima durable, atau sudah pernah diproses (duplikat).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "400":
          description: Payload tidak valid (field wajib hilang / format salah).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Bearer token hilang atau salah. Event TIDAK disimpan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Token valid tetapi device tidak diizinkan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Batch sudah pernah diproses (duplikat). Body sama dengan 200 dan
            `duplicate: true`; client memperlakukannya sebagai acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "413":
          description: Body melebihi batas (mock 2 MB).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit. Client retry dengan backoff.
          headers:
            Retry-After:
              description: Detik sebelum percobaan berikutnya (opsional).
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Gangguan server. Client retry dengan backoff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/health:
    get:
      summary: Health check
      operationId: health
      security: []
      responses:
        "200":
          description: API hidup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health:
    get:
      summary: Alias health check (mock server)
      operationId: healthAlias
      security: []
      responses:
        "200":
          description: API hidup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/events:
    get:
      summary: Inspeksi event tersimpan (mock / dev only)
      description: |
        Hanya untuk mock server dan diagnosa. Server produksi boleh tidak
        menyediakan endpoint ini.
      operationId: listSyncEvents
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          required: false
          description: Kembalikan event dengan `received_at` setelah waktu ini (ISO date-time).
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Daftar event yang tersimpan.
          content:
            application/json:
              schema:
                type: object
                required: [count, total, events]
                properties:
                  count:
                    type: integer
                    description: Jumlah event pada respons ini.
                  total:
                    type: integer
                    description: Total event tersimpan.
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/StoredEvent"
        "400":
          description: Parameter `since` bukan date-time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Bearer token hilang atau salah.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        API key per device. Disimpan client di localStorage (WebView offline)
        dan hanya dikirim sebagai header — tidak pernah ditulis ke log.
  schemas:
    SyncRequest:
      type: object
      required: [device_id, events]
      additionalProperties: false
      properties:
        device_id:
          type: string
          format: uuid
          description: ID device dari settings client (dibuat sekali, persisten).
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SyncEvent"
    SyncEvent:
      type: object
      required: [event_id, event_type, aggregate_id, schema_version, occurred_at, payload]
      additionalProperties: false
      properties:
        event_id:
          type: string
          format: uuid
          description: UUID murni, kunci idempotensi. Retry memakai nilai yang sama.
        event_type:
          type: string
          examples: [order.completed, order.voided]
        aggregate_type:
          type: string
          default: order
          examples: [order]
        aggregate_id:
          type: string
          description: ID agregat lokal (mis. order id).
        schema_version:
          type: integer
          minimum: 1
          default: 1
        occurred_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
    SyncResponse:
      type: object
      required: [acknowledged_event_ids, rejected]
      properties:
        acknowledged_event_ids:
          type: array
          items:
            type: string
            format: uuid
        rejected:
          type: array
          items:
            $ref: "#/components/schemas/RejectedEvent"
        duplicates:
          type: array
          description: Subset event_id yang sudah pernah diterima (tidak menambah baris).
          items:
            type: string
            format: uuid
        duplicate:
          type: boolean
          default: false
          description: true bila SELURUH batch sudah pernah diterima.
    RejectedEvent:
      type: object
      required: [event_id, code, message]
      properties:
        event_id:
          type: string
          format: uuid
        code:
          type: string
          examples: [VALIDATION_ERROR, MOCK_REJECT]
        message:
          type: string
    StoredEvent:
      type: object
      required: [seq, event_id, event_type, aggregate_id, device_id, received_at]
      properties:
        seq:
          type: integer
          description: Urutan terima (monotonik, per proses mock).
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
        aggregate_type:
          type: string
        aggregate_id:
          type: string
        schema_version:
          type: integer
        occurred_at:
          type: string
          format: date-time
        device_id:
          type: string
        received_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
    Health:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        mock:
          type: boolean
        auth:
          type: string
          enum: [on, off]
        events:
          type: integer
          description: Jumlah event tersimpan (mock).
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [UNAUTHORIZED, VALIDATION_ERROR, MISSING_DEVICE_ID]
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                description: Indeks event pada batch (bila relevan).
              field:
                type: string
              message:
                type: string
