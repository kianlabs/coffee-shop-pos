<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP untuk bundle Vite/Capacitor; tiap direktif dijelaskan di
         docs/security-csp.md. style-src butuh 'unsafe-inline' karena React
         memakai style attribute; script tetap hanya 'self'.
         frame-ancestors TIDAK dicantumkan: direktif itu diabaikan browser bila
         dikirim lewat <meta> dan memicu error console. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https: http:; frame-src 'none'; object-src 'none'; form-action 'self'; base-uri 'self'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f2b4d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Suro POS — aplikasi kasir offline-first untuk kedai kopi"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Suro POS — Kasir</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
